<app-navigation></app-navigation>
<div class="sponsors">
  
<h1 class="posseidon heading">Financial Sponsors</h1>

<div class="cc">
<!-- MOBILE VIEW -->
<div *ngIf="isMobile">
  <app-carousel  
    [numOfslides]="numOfSlides" 
    [photos]="photosFinancial" 
    [spacing]="150" 
    [hover]="true" 
    [arrows]="true" 
    [url]="true">
  </app-carousel>
</div>

<!-- DESKTOP VIEW -->
<div *ngIf="!isMobile">
  <div class="poseidon-temp">
    <div 
      *ngFor="let photo of photosFinancial" 
      class="keen-slider__slide slide number-slide">
      <img class="poseidon-photo" [ngSrc]="photo.src" fill priority>
      <p class="onHover">
        {{photo.description}} 
        <a href="{{photo.pageUrl}}" target="_blank">See More</a>
      </p>
    </div>
  </div>
</div>
